<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Engineering loop</title>
  <desc id="desc">Idea, design, build, test, ship, monitor, fix bugs, and new features in a continuous software engineering loop.</desc>
  <style>
    :root{--panel:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#656d76;--accent:#087f8c;--track:#d8dee4}
    @media(prefers-color-scheme:dark){:root{--panel:#0d1117;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--accent:#54d3d8;--track:#30363d}}
    .panel{fill:var(--panel);stroke:var(--border)}.track{fill:none;stroke:var(--track);stroke-width:2}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .halo{animation:pulse 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes pulse{0%,100%{opacity:.18;transform:scale(.75)}50%{opacity:.55;transform:scale(1.35)}}
    @media(prefers-reduced-motion:reduce){.halo{animation:none;opacity:.25}}
  </style>
  <rect class="panel" x="1" y="1" width="1198" height="278" rx="20"/>
  <text class="muted mono" x="38" y="38" font-size="13" letter-spacing="1.2">ENGINEERING LOOP</text>
  <path id="loop" class="track" d="M230 105 C370 58 830 58 970 105 C1055 134 1055 198 970 227 C830 274 370 274 230 227 C145 198 145 134 230 105 Z"/>

  <g class="sans" font-size="12" font-weight="650" text-anchor="middle">
    <text class="text" x="230" y="88">IDEA</text>
    <text class="text" x="400" y="68">DESIGN</text>
    <text class="text" x="600" y="62">BUILD</text>
    <text class="text" x="800" y="68">TEST</text>
    <text class="text" x="970" y="88">SHIP</text>
    <text class="text" x="980" y="246">MONITOR</text>
    <text class="text" x="650" y="268">FIX BUGS</text>
    <text class="text" x="300" y="252">NEW FEATURES</text>
  </g>

  <g text-anchor="middle">
    <text class="text sans" x="600" y="153" font-size="25" font-weight="700">SHIP · OBSERVE · IMPROVE</text>
    <text class="muted mono" x="600" y="180" font-size="12" letter-spacing="1">SOFTWARE KEEPS EVOLVING AFTER RELEASE</text>
  </g>

  <circle class="accent halo" cx="0" cy="0" r="10">
    <animateMotion dur="11s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion>
  </circle>
  <circle class="accent" cx="0" cy="0" r="5">
    <animateMotion dur="11s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion>
  </circle>
</svg>