<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">How I like to work</title>
  <desc id="desc">A continuous engineering cycle: idea, design, build, test, ship, monitor, fix bugs, and add new features.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #087f8c;
      --track: #d8dee4;
      --node: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161b22;
        --border: #30363d;
        --text: #f0f6fc;
        --muted: #8b949e;
        --accent: #54d3d8;
        --track: #30363d;
        --node: #0d1117;
      }
    }

    .bg { fill: var(--bg); stroke: var(--border); }
    .track { fill: none; stroke: var(--track); stroke-width: 3; }
    .node { fill: var(--node); stroke: var(--track); stroke-width: 2; }
    .text { fill: var(--text); }
    .muted { fill: var(--muted); }
    .accent { fill: var(--accent); }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }

    @keyframes pulse {
      0%, 100% { opacity: .22; transform: scale(.8); }
      50% { opacity: .75; transform: scale(1.45); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: .35; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="1198" height="498" rx="22"/>

  <text class="muted mono" x="42" y="45" font-size="14" letter-spacing="1.4">HOW I LIKE TO WORK</text>

  <path id="cycle" class="track" d="M 255 118 C 410 56, 790 56, 945 118 C 1055 162, 1055 338, 945 382 C 790 444, 410 444, 255 382 C 145 338, 145 162, 255 118 Z"/>

  <g>
    <circle class="node" cx="260" cy="116" r="32"/>
    <text class="text sans" x="260" y="122" text-anchor="middle" font-size="14" font-weight="700">IDEA</text>
  </g>

  <g>
    <circle class="node" cx="480" cy="83" r="36"/>
    <text class="text sans" x="480" y="89" text-anchor="middle" font-size="14" font-weight="700">DESIGN</text>
  </g>

  <g>
    <circle class="node" cx="720" cy="83" r="34"/>
    <text class="text sans" x="720" y="89" text-anchor="middle" font-size="14" font-weight="700">BUILD</text>
  </g>

  <g>
    <circle class="node" cx="940" cy="116" r="33"/>
    <text class="text sans" x="940" y="122" text-anchor="middle" font-size="14" font-weight="700">TEST</text>
  </g>

  <g>
    <circle class="node" cx="1030" cy="250" r="34"/>
    <text class="text sans" x="1030" y="256" text-anchor="middle" font-size="14" font-weight="700">SHIP</text>
  </g>

  <g>
    <circle class="node" cx="900" cy="395" r="43"/>
    <text class="text sans" x="900" y="401" text-anchor="middle" font-size="13" font-weight="700">MONITOR</text>
  </g>

  <g>
    <circle class="node" cx="600" cy="430" r="43"/>
    <text class="text sans" x="600" y="436" text-anchor="middle" font-size="13" font-weight="700">FIX BUGS</text>
  </g>

  <g>
    <circle class="node" cx="300" cy="395" r="54"/>
    <text class="text sans" x="300" y="391" text-anchor="middle" font-size="12" font-weight="700">NEW</text>
    <text class="text sans" x="300" y="408" text-anchor="middle" font-size="12" font-weight="700">FEATURES</text>
  </g>

  <g text-anchor="middle">
    <text class="text sans" x="600" y="236" font-size="34" font-weight="750">SHIP ≠ DONE</text>
    <text class="muted mono" x="600" y="269" font-size="14" letter-spacing="1">OBSERVE · FIX · EVOLVE</text>
  </g>

  <circle class="accent pulse" cx="0" cy="0" r="12" opacity=".28">
    <animateMotion dur="12s" repeatCount="indefinite" rotate="auto">
      <mpath href="#cycle"/>
    </animateMotion>
  </circle>

  <circle class="accent" cx="0" cy="0" r="6">
    <animateMotion dur="12s" repeatCount="indefinite" rotate="auto">
      <mpath href="#cycle"/>
    </animateMotion>
  </circle>
</svg>