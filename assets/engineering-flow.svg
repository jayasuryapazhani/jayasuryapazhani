<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Engineering flow</title>
  <desc id="desc">Idea to design to build to test to ship, with a subtle animated signal progressing through each stage.</desc>
  <style>
    :root {
      --bg: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #087f8c;
      --track: #d8dee4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161b22;
        --border: #30363d;
        --text: #f0f6fc;
        --muted: #8b949e;
        --accent: #54d3d8;
        --track: #30363d;
      }
    }
    .bg { fill: var(--bg); stroke: var(--border); }
    .text { fill: var(--text); }
    .muted { fill: var(--muted); }
    .track { stroke: var(--track); }
    .accent { fill: var(--accent); stroke: var(--accent); }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .signal { animation: signal 5s ease-in-out infinite; }
    .s2 { animation-delay: 1s; }
    .s3 { animation-delay: 2s; }
    .s4 { animation-delay: 3s; }
    .s5 { animation-delay: 4s; }
    @keyframes signal {
      0%, 18%, 100% { opacity: .22; }
      8% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal { animation: none; opacity: .65; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="1198" height="178" rx="18"/>
  <text class="muted mono" x="38" y="38" font-size="14" letter-spacing="1.3">HOW I LIKE TO WORK</text>

  <line class="track" x1="130" y1="94" x2="1070" y2="94" stroke-width="2"/>

  <g>
    <circle cx="130" cy="94" r="13" fill="var(--bg)" stroke="var(--track)" stroke-width="2"/>
    <circle class="accent signal" cx="130" cy="94" r="7"/>
    <text class="text sans" x="130" y="137" font-size="15" text-anchor="middle" font-weight="600">IDEA</text>
  </g>
  <g>
    <circle cx="365" cy="94" r="13" fill="var(--bg)" stroke="var(--track)" stroke-width="2"/>
    <circle class="accent signal s2" cx="365" cy="94" r="7"/>
    <text class="text sans" x="365" y="137" font-size="15" text-anchor="middle" font-weight="600">DESIGN</text>
  </g>
  <g>
    <circle cx="600" cy="94" r="13" fill="var(--bg)" stroke="var(--track)" stroke-width="2"/>
    <circle class="accent signal s3" cx="600" cy="94" r="7"/>
    <text class="text sans" x="600" y="137" font-size="15" text-anchor="middle" font-weight="600">BUILD</text>
  </g>
  <g>
    <circle cx="835" cy="94" r="13" fill="var(--bg)" stroke="var(--track)" stroke-width="2"/>
    <circle class="accent signal s4" cx="835" cy="94" r="7"/>
    <text class="text sans" x="835" y="137" font-size="15" text-anchor="middle" font-weight="600">TEST</text>
  </g>
  <g>
    <circle cx="1070" cy="94" r="13" fill="var(--bg)" stroke="var(--track)" stroke-width="2"/>
    <circle class="accent signal s5" cx="1070" cy="94" r="7"/>
    <text class="text sans" x="1070" y="137" font-size="15" text-anchor="middle" font-weight="600">SHIP</text>
  </g>
</svg>