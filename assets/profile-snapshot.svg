<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Profile snapshot</title>
  <desc id="desc">A minimal software engineering profile summary.</desc>
  <style>
    :root{--bg:#f6f8fa;--panel:#fff;--border:#d0d7de;--text:#1f2328;--muted:#656d76;--accent:#087f8c}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--accent:#54d3d8}}
    .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--border)} .text{fill:var(--text)} .muted{fill:var(--muted)} .accent{fill:var(--accent)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <rect class="bg" width="1200" height="220" rx="22"/>
  <rect class="panel" x="18" y="18" width="1164" height="184" rx="18"/>
  <text class="muted mono" x="52" y="54" font-size="14" letter-spacing="1.4">PROFILE SNAPSHOT</text>
  <line x1="52" y1="72" x2="1148" y2="72" stroke="var(--border)"/>

  <text class="muted mono" x="52" y="108" font-size="14">ROLE</text>
  <text class="text sans" x="160" y="108" font-size="17" font-weight="600">Software Engineer</text>

  <text class="muted mono" x="52" y="143" font-size="14">FOCUS</text>
  <text class="text sans" x="160" y="143" font-size="17">Full-stack development · product engineering · developer tools</text>

  <text class="muted mono" x="52" y="178" font-size="14">BASED</text>
  <text class="text sans" x="160" y="178" font-size="17">Ontario, Canada</text>

  <text class="muted mono" x="760" y="108" font-size="14">CONTACT</text>
  <text class="accent sans" x="860" y="108" font-size="17">pazhanijayasurya@gmail.com</text>

  <text class="muted mono" x="760" y="143" font-size="14">PORTFOLIO</text>
  <text class="text sans" x="860" y="143" font-size="17">jay-shell.vercel.app</text>

  <text class="muted mono" x="760" y="178" font-size="14">MODE</text>
  <text class="text sans" x="860" y="178" font-size="17">build · test · ship · improve</text>
</svg>