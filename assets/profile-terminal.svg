  <text class="muted mono" x="46" y="48" font-size="14">jayasurya@github:~ $</text>
  <text class="text mono" x="220" y="48" font-size="14">whoami</text>
  <rect class="accent cursor" x="278" y="35" width="8" height="17" rx="1"/>
  <text class="text sans" x="46" y="112" font-size="43" font-weight="700">Jayasurya Pazhani</text>
  <text class="accent mono" x="46" y="151" font-size="20">Software Engineer</text>
  <text class="muted sans" x="46" y="190" font-size="17">Full-stack systems · browser products · developer tooling · quality engineering</text>
