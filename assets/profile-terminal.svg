<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Jayasurya Pazhani — Software Engineer</title>
  <desc id="desc">Minimal software engineering profile masthead.</desc>
  <style>
    :root { --panel:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#656d76; --accent:#087f8c; }
    @media (prefers-color-scheme: dark) { :root { --panel:#0d1117; --border:#30363d; --text:#f0f6fc; --muted:#8b949e; --accent:#54d3d8; } }
    .panel{fill:var(--panel);stroke:var(--border)} .text{fill:var(--text)} .muted{fill:var(--muted)} .accent{fill:var(--accent)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .cursor{animation:blink 1.15s steps(1,end) infinite}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
