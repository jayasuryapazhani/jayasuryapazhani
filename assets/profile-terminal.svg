<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Jayasurya Pazhani — Software Engineer</title>
  <desc id="desc">A minimal terminal-inspired profile masthead with a blinking cursor and subtle live status indicator.</desc>
  <style>
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #087f8c;
      --accent-soft: #d9f4f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #f0f6fc;
        --muted: #8b949e;
        --accent: #54d3d8;
        --accent-soft: #12393c;
      }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--border); }
    .text { fill: var(--text); }
    .muted { fill: var(--muted); }
    .accent { fill: var(--accent); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.15s steps(1,end) infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 69px 289px; }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.72); } 50% { opacity: .85; transform: scale(1.28); } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .pulse { animation: none; }
      .cursor { opacity: 1; }
      .pulse { opacity: .45; }
    }
  </style>

  <rect class="bg" width="1200" height="360" rx="22"/>
  <rect class="panel" x="18" y="18" width="1164" height="324" rx="18"/>

  <text class="muted mono" x="52" y="56" font-size="15" letter-spacing="1.4">PROFILE / ENGINEERING</text>
  <text class="accent mono" x="1110" y="57" font-size="19" text-anchor="end">&gt;_</text>
  <line x1="52" y1="76" x2="1148" y2="76" stroke="var(--border)"/>

  <text class="muted mono" x="52" y="112" font-size="18">jayasurya@github:~$</text>
  <text class="text mono" x="268" y="112" font-size="18">whoami</text>
  <rect class="accent cursor" x="342" y="95" width="10" height="21" rx="1"/>

  <text class="text sans" x="52" y="178" font-size="42" font-weight="650">Jayasurya Pazhani</text>
  <text class="accent mono" x="52" y="218" font-size="20">Software Engineer · full-stack systems · developer tools</text>
  <text class="muted sans" x="52" y="252" font-size="17">I build software meant to survive beyond localhost.</text>

  <circle cx="69" cy="289" r="13" fill="var(--accent-soft)"/>
  <circle class="accent pulse" cx="69" cy="289" r="7"/>
  <text class="muted mono" x="94" y="295" font-size="15">STATUS</text>
  <text class="text mono" x="162" y="295" font-size="15">shipping useful software</text>

  <text class="muted mono" x="620" y="295" font-size="15">MODE</text>
  <text class="text mono" x="676" y="295" font-size="15">product / systems / quality</text>

  <line x1="52" y1="318" x2="1148" y2="318" stroke="var(--border)"/>
</svg>